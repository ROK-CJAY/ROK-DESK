appId: es.rok.desk
productName: ROK Desk
copyright: ROK Esports
asar: true
# npmRebuild: false is intentional. uiohook-napi is the only production native dependency and ships
# N-API prebuilds (ABI-stable across Electron versions), so electron-builder must not compile it from
# source. Any future native dependency must revisit this setting (it may need an Electron rebuild).
npmRebuild: false
asarUnpack:
  - "**/node_modules/uiohook-napi/prebuilds/**"
directories:
  output: release
  buildResources: electron/resources
files:
  - electron/**/*
  - package.json
extraResources:
  - from: .output
    to: output
extraMetadata:
  main: electron/main.mjs
publish:
  provider: github
  owner: ROK-CJAY
  repo: ROK-DESK
  vPrefixedTagName: true
  releaseType: release
win:
  target:
    - portable
    - nsis
  artifactName: ROK-Desk-${version}-${os}-${arch}.${ext}
  icon: public/brand/rok-mark.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  include: electron/installer.nsh
  allowElevation: true
  shortcutName: ROK Desk
  deleteAppDataOnUninstall: false
  artifactName: ROK-Desk-${version}-${os}-${arch}-setup.${ext}
linux:
  target:
    - AppImage
  category: Utility
  artifactName: ROK-Desk-${version}-${os}-${arch}.${ext}
  icon: public/brand/rok-mark.png
mac:
  target:
    - dmg
  category: public.app-category.utilities
  artifactName: ROK-Desk-${version}-${os}-${arch}.${ext}
  icon: public/brand/rok-mark.png
  identity: null
