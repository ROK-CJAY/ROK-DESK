<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ROK Desk</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b0d12;
      color: #f4f1ea;
      font: 15px/1.45 "Segoe UI", sans-serif;
    }
    main { width: min(28rem, calc(100% - 32px)); }
    p.kicker {
      margin: 0;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #9a948a;
    }
    h1 { margin: 8px 0 0; font-size: 28px; letter-spacing: 0.04em; text-transform: uppercase; }
    p.lead { margin: 10px 0 0; color: #b7b1a6; }
    button, input {
      font: inherit;
      color: inherit;
    }
    button.choice, button.go {
      width: 100%;
      margin-top: 14px;
      border: 1px solid #3a3f4b;
      background: #171b24;
      border-radius: 10px;
      padding: 14px 16px;
      text-align: left;
      cursor: pointer;
    }
    button.choice strong, button.go { display: block; }
    button.choice span, label span {
      display: block;
      margin-top: 4px;
      color: #9a948a;
      font-size: 13px;
    }
    button.choice:hover, button.go:hover { border-color: #c73a3a; }
    label { display: block; margin-top: 18px; color: #b7b1a6; font-size: 13px; }
    input {
      width: 100%;
      margin-top: 8px;
      height: 42px;
      border-radius: 8px;
      border: 1px solid #3a3f4b;
      background: #10141c;
      padding: 0 12px;
    }
    button.go { text-align: center; font-weight: 600; }
    p.err { min-height: 1.2em; margin: 12px 0 0; color: #e06a6a; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <p class="kicker">ROK Desk</p>
    <h1>Who is this PC?</h1>
    <p class="lead">The host runs the desk. Every other computer opens that same desk.</p>
    <button class="choice" id="host" type="button">
      <strong>This PC is the host</strong>
      <span>Server room or the main machine. Production, tournaments, and overlays live here.</span>
    </button>
    <label>
      Connect to the host
      <span>Production and tournament computers. The full desk opens. This PC does not keep its own event.</span>
      <input id="address" placeholder="192.168.1.20" autocomplete="off" />
    </label>
    <button class="go" id="join" type="button">Connect</button>
    <p class="err" id="error"></p>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const address = document.getElementById("address");
    const error = document.getElementById("error");
    address.value = params.get("address") || "";
    error.textContent = params.get("error") || "";
    document.getElementById("host").addEventListener("click", () => {
      error.textContent = "Starting the host…";
      void window.rokDesk.becomeHost();
    });
    document.getElementById("join").addEventListener("click", async () => {
      error.textContent = "Looking for that host…";
      const result = await window.rokDesk.connectHost(address.value);
      if (result && result.error) error.textContent = result.error;
    });
    address.addEventListener("keydown", (event) => {
      if (event.key === "Enter") document.getElementById("join").click();
    });
  </script>
</body>
</html>
