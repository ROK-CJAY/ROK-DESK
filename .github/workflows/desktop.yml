name: Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win portable nsis
          - os: ubuntu-latest
            args: --linux AppImage
          - os: macos-latest
            args: --mac dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:desktop
      - run: npx electron-builder ${{ matrix.args }} --publish never
      # Release assets do not count toward the Actions artifact quota.
      # Attach installers first so a full storage bucket cannot skip the release.
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/ROK-Desk-*.exe
            release/ROK-Desk-*.dmg
            release/ROK-Desk-*.AppImage
            release/ROK-Desk-*.zip
            release/*.yml
            release/*.blockmap
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Manual runs only: a few installer files, 1-day retention. Never upload unpacked Electron trees.
      - if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: rok-desk-${{ matrix.os }}
          retention-days: 1
          if-no-files-found: warn
          path: |
            release/ROK-Desk-*.exe
            release/ROK-Desk-*.dmg
            release/ROK-Desk-*.AppImage
            release/ROK-Desk-*.zip
            release/*.yml
            release/*.blockmap
